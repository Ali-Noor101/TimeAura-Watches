<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mens - TimeAura</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
    }

    nav {
            background-color: #0d224c; 
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 500;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

    h1 {
      text-align: center;
      margin-top: 25px;
      font-size: 26px;
      color: #000;
    }

    .container {
      width: 90%;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 40px;
    }

    .card {
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 15px;
      box-shadow: 0 0 8px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 250px;
      border-radius: 10px;
      object-fit: cover;
    }

    .card h3 {
      margin-top: 15px;
      font-size: 16px;
      color: #333;
    }

    .card button {
      margin-top: 12px;
      padding: 10px;
      width: 80%;
      background-color: #1a2b4c;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .card button:hover {
      background-color: #162243;
    }
  </style>
</head>
