<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - TimeAura</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; }

    nav {
            background-color: #0d224c; 
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        nav .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-weight: 500;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }
    .hero {
      background-image: url('images/login.jpg'); 
      background-size: cover;
      background-position: center;
      height: calc(100vh - 50px);
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.6);
      background-blend-mode: lighten;
    }

    .login-box {
      background-color: white;
      padding: 30px 40px;
      border-radius: 8px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .login-box h2 { margin-bottom: 15px; }
    .login-box input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background-color: #1a2b4c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-box button:hover { background-color: #162243; }

    .small-link { margin-top: 10px; font-size: 14px; }
    .small-link a { color: #1a2b4c; text-decoration: none; font-weight: bold; }

    .error { color: #b00020; font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>

  <nav>
        <div class="logo">TimeAura Watches</div>

        <ul>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="home.html">Home</a></li>
            <li><a href="categories.html">Categories</a></li>
            <li><a href="topsellers.html">Top Sellers</a></li>
            <li><a href="signup.html">Login</a></li>
        </ul>
    </nav>

  <div class="hero">
    <div class="login-box">
      <h2>Create an Account</h2>
      <p>Fill the details to sign up</p>

      <form id="signupForm">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <input id="confirm" type="password" placeholder="Confirm Password" required>
        <div id="error" class="error" aria-live="polite"></div>
        <button type="submit">Sign Up</button>
      </form>

      <p class="small-link">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>
    </div>
  </div>

<script>


function loadUsers() {
  const raw = localStorage.getItem('myshop_users');
  if (!raw) return [];
  try { return JSON.parse(raw); } catch(e) { return []; }
}
function saveUsers(users) {
  localStorage.setItem('myshop_users', JSON.stringify(users));
}

document.getElementById('signupForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const err = document.getElementById('error');
  err.textContent = '';

  if (!email || !password || !confirm) { err.textContent = 'Please fill all fields.'; return; }
  if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
  if (password !== confirm) { err.textContent = 'Passwords do not match.'; return; }

  const users = loadUsers();
  if (users.find(u => u.email === email)) {
    err.textContent = 'An account with this email already exists. Please login.';
    return;
  }

  users.push({ email: email, password: password });
  saveUsers(users);

  alert('Account created. You will be redirected to the login page.');
  window.location.href = 'login.html';
});
</script>

</body>
</html>
